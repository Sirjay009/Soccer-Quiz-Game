<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--Meta tags for search engines-->
    <meta name="description" content="Soccer Quiz Game" />
    <meta name="keywords" content="Soccer, Quiz, Football, Game" />
    <meta name="author" content="Chima Obutte" />
    <title>Soccer Quiz Game</title>
    <!--Favicon-->
    <link rel="icon" type="images/x-icon" href="favicon/Favicon-32x32.png" />
    <!--Stylesheet-->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <header id="welcome-page" class="container">
      <h1>Welcome!</h1>
      <h2>Let's test your soccer⚽ knowledge</h2>
      <p>Please click the start button to begin when you are ready</p>
      <button id="start-btn">Start</button>
    </header>

    <main>
      <!--Game section-->
      <section id="game-container" class="container">
        <h2>Who's this?</h2>

        <div id="game-grid">
          <img
            id="random-image"
            src="assets/images/AlissonBecker.jpg2.jpg"
            alt="Random player image"
            width="190"
            height="290"
          />

          <div id="answer-buttons" class="button-grid"></div>
        </div>

        <!--Message section-->
        <div class="message-grid">
          <div id="messages"></div>
          <div id="score-area">
            <p class="scores">Correct Answers:<span id="score">0</span></p>
            <p class="scores">
              Incorrect Answers:<span id="incorrect">0</span>
            </p>
          </div>
          <button id="restart-btn">Restart</button>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2024 Soccer Quiz Game by Chima Obutte. All rights reserved.</p>
    </footer>

    <script src="assets/js/script.js"></script>
  </body>
</html>
